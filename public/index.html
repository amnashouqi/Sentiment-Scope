<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Scope</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        #result {
            margin-top: 20px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>Sentiment Scope</h1>
    <p>Enter your feedback below to analyze sentiment.</p>
    <textarea id="feedback" rows="4" cols="50"></textarea><br>
    <button id="analyzeBtn">Analyze</button>
    <div id="result"></div>
    <script>
        document.getElementById('analyzeBtn').addEventListener('click', async () => {
            const feedback = document.getElementById('feedback').value;
            const res = await fetch('/analyze-feedback', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ feedback })
            });
            const data = await res.json();
            document.getElementById('result').textContent = data.sentimentAnalysis || data.error;
        });
    </script>
</body>
</html>
